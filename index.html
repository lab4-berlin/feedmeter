<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#fbeef1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FeedMeter" />
  <title>FeedMeter</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f7c8d4'/%3E%3Ccircle cx='32' cy='28' r='10' fill='%23fff'/%3E%3Crect x='28' y='34' width='8' height='18' rx='4' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <h1>FeedMeter</h1>
    </div>
    <button class="header-btn" id="exportBtn" title="Export data" aria-label="Export data">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  </header>

  <main class="container">
    <!-- Quick stats -->
    <section class="stats" id="stats">
      <div class="stat">
        <span class="stat-label">Last feed</span>
        <span class="stat-value" id="statLast">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Today (breast)</span>
        <span class="stat-value" id="statBreast">0 min</span>
      </div>
      <div class="stat">
        <span class="stat-label">Today (intake)</span>
        <span class="stat-value" id="statIntake">0 ml</span>
      </div>
    </section>

    <!-- 4 big action buttons -->
    <section class="grid" id="actionGrid" aria-label="Start a new session">
      <button class="tile tile-left" data-action="left" aria-label="Left breast">
        <span class="tile-content">
          <span class="tile-letter">L</span>
          <span class="tile-name">Breast</span>
        </span>
        <span class="tile-live" aria-hidden="true">
          <span class="live-badge"><span class="pulse"></span>LIVE</span>
          <span class="live-timer">00:00</span>
          <span class="live-hint">Tap to stop</span>
        </span>
      </button>

      <button class="tile tile-right" data-action="right" aria-label="Right breast">
        <span class="tile-content">
          <span class="tile-letter">R</span>
          <span class="tile-name">Breast</span>
        </span>
        <span class="tile-live" aria-hidden="true">
          <span class="live-badge"><span class="pulse"></span>LIVE</span>
          <span class="live-timer">00:00</span>
          <span class="live-hint">Tap to stop</span>
        </span>
      </button>

      <button class="tile tile-bottle" data-action="bottle" aria-label="Bottle">
        <span class="tile-content">
          <svg class="tile-svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M26 8h12"/>
            <path d="M24 14h16"/>
            <path d="M22 20h20l-1.5 30a4 4 0 0 1-4 3.8h-9a4 4 0 0 1-4-3.8z"/>
            <path d="M26 36h12" opacity="0.5"/>
          </svg>
          <span class="tile-name">Bottle</span>
        </span>
        <span class="tile-live" aria-hidden="true">
          <span class="live-badge"><span class="pulse"></span>LIVE</span>
          <span class="live-timer">00:00</span>
          <span class="live-hint">Tap to stop</span>
        </span>
      </button>

      <button class="tile tile-pump" data-action="pump" aria-label="Pump">
        <span class="tile-content">
          <svg class="tile-svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 28c0-8 5-14 13-14s13 6 13 14"/>
            <path d="M14 28h22v6a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4z"/>
            <path d="M38 31h6a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-6"/>
            <path d="M22 38v8a4 4 0 0 0 4 4h2a4 4 0 0 0 4-4v-8" opacity="0.5"/>
          </svg>
          <span class="tile-name">Pump</span>
        </span>
        <span class="tile-live" aria-hidden="true">
          <span class="live-badge"><span class="pulse"></span>LIVE</span>
          <span class="live-timer">00:00</span>
          <span class="live-hint">Tap to stop</span>
        </span>
      </button>
    </section>

    <!-- History -->
    <section class="history">
      <div class="history-head">
        <h2>History</h2>
        <button class="link-btn" id="clearAllBtn">Clear all</button>
      </div>
      <ul class="entries" id="entries"></ul>
      <p class="empty" id="emptyState">No entries yet. Tap a button above to start.</p>
    </section>
  </main>

  <!-- Stop modal: collects extra info per session type -->
  <div class="modal hidden" id="stopModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h3 id="modalTitle">Save session</h3>
      <p class="modal-sub" id="modalSub"></p>

      <div class="field" id="sourceField">
        <label>Source</label>
        <div class="seg" role="radiogroup" aria-label="Bottle source">
          <button type="button" class="seg-btn" data-source="own">Own milk</button>
          <button type="button" class="seg-btn" data-source="formula">Formula</button>
        </div>
      </div>

      <div class="field" id="volumeField">
        <label for="volumeInput">Volume (ml)</label>
        <input id="volumeInput" type="number" inputmode="numeric" min="0" step="5" placeholder="e.g. 60" />
      </div>

      <div class="modal-actions">
        <button class="btn ghost" id="cancelSave">Discard</button>
        <button class="btn primary" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal hidden" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal-card">
      <h3 id="editTitle">Edit entry</h3>

      <div class="field">
        <label for="editStart">Start</label>
        <input id="editStart" type="datetime-local" step="60" />
      </div>
      <div class="field">
        <label for="editEnd">End</label>
        <input id="editEnd" type="datetime-local" step="60" />
      </div>

      <div class="field" id="editSourceField">
        <label>Source</label>
        <div class="seg" role="radiogroup">
          <button type="button" class="seg-btn" data-edit-source="own">Own milk</button>
          <button type="button" class="seg-btn" data-edit-source="formula">Formula</button>
        </div>
      </div>

      <div class="field" id="editVolumeField">
        <label for="editVolume">Volume (ml)</label>
        <input id="editVolume" type="number" inputmode="numeric" min="0" step="5" />
      </div>

      <div class="modal-actions space-between">
        <button class="btn danger" id="deleteEntry">Delete</button>
        <div>
          <button class="btn ghost" id="cancelEdit">Cancel</button>
          <button class="btn primary" id="saveEdit">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
